<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="大学之家收录教育部 2025 年《全国高等学校名单》全部 2919 所普通高校（本科 1365 + 专科 1554），覆盖 99.5% 官方网址，支持按省份筛选与 985 / 211 / 双一流标签识别，帮你一键直达目标高校官网。">
<title>大学之家 · 全国高校导航</title>
<style>
:root{
  --brand:#0C447C; --brand-light:#E6F1FB; --brand-mid:#3E72AE;
  --bg:#F5F7FA; --card:#FFFFFF; --text:#1A1A1A; --text-2:#5A6472; --text-3:#8A94A6;
  --border:#E3E8EF; --border-2:#D2DAE6;
  --green:#1F8A4C; --amber:#B7791F; --red:#C0392B;
  --radius:12px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);}
.top{padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.brand{font-size:20px;font-weight:700;color:var(--brand);letter-spacing:1px;display:flex;align-items:center;gap:8px;white-space:nowrap;}
.brand .logo{width:28px;height:28px;border-radius:8px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;}
.search{flex:1;min-width:200px;position:relative;}
.search input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--border-2);border-radius:10px;font-size:14px;outline:none;background:#fff;}
.search input:focus{border-color:var(--brand);}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-3);}
.filters{display:flex;gap:8px;flex-wrap:wrap;}
.filters select{padding:9px 10px;border:1px solid var(--border-2);border-radius:9px;font-size:13px;background:#fff;color:var(--text);outline:none;}
.caps{display:flex;gap:8px;flex-wrap:wrap;padding:10px 20px;border-top:1px solid var(--border);}
.cap{flex:0 0 auto;padding:6px 14px;border:1px solid var(--border-2);border-radius:999px;font-size:13px;background:#fff;color:var(--text-2);cursor:pointer;white-space:nowrap;transition:all .15s;}
.cap:hover{border-color:var(--brand);color:var(--brand);}
.cap.active{background:var(--brand);color:#fff;border-color:var(--brand);}
.hero{max-width:1200px;margin:0 auto;padding:26px 20px 4px;}
.hero h1{font-size:25px;margin:0;color:var(--brand);letter-spacing:1px;font-weight:700;}
.hero .slogan{font-size:17px;font-weight:600;color:var(--text);margin:8px 0 12px;}
.hero .desc{font-size:14px;color:var(--text-2);line-height:1.85;margin:0;max-width:780px;}
main{max-width:1200px;margin:0 auto;padding:20px;}
.prov{margin-bottom:34px;scroll-margin-top:calc(var(--header-h,170px) + 12px);}
.prov h2{font-size:18px;margin:0 0 14px;display:flex;align-items:center;gap:10px;color:var(--text);}
.prov h2 .cnt{font-size:13px;font-weight:400;color:var(--text-3);background:var(--bg);padding:2px 10px;border-radius:999px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
.card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:box-shadow .15s,border-color .15s;overflow:hidden;}
.card:hover{border-color:var(--brand);box-shadow:0 4px 16px rgba(12,68,124,.10);}
.card .name{font-size:15px;font-weight:600;line-height:1.35;margin-bottom:8px;padding-right:24px;}
.code{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);margin-bottom:8px;}
.loc{font-size:12px;color:var(--text-3);margin-bottom:10px;line-height:1.5;}
.loc b{color:var(--text-2);font-weight:500;margin-right:4px;}
.copy{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border:1px solid var(--border-2);border-radius:6px;color:var(--brand);font-size:11px;cursor:pointer;background:#fff;user-select:none;}
.copy:hover{background:var(--brand-light);}
.copy.done{background:var(--green);color:#fff;border-color:var(--green);}
.tags{display:flex;gap:5px;flex-wrap:wrap;}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--brand-light);color:var(--brand);}
.tag.lvl{background:#F0F4F8;color:var(--text-2);}
.tag.bachelor{background:#EAF4EE;color:var(--green);}
.tag.junior{background:#FDEFE6;color:var(--amber);}
.tag.priv{background:#FBEDED;color:var(--red);}
.tag.coop{background:#F3F1EA;color:#7A5B00;}
.detail{max-height:0;overflow:hidden;transition:max-height .25s ease;font-size:12px;color:var(--text-2);line-height:1.7;}
.card:hover .detail,.card.open .detail{max-height:170px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.detail b{color:var(--text);font-weight:600;}
.detail a{color:var(--brand);}
.info-btn{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;border:1px solid var(--border-2);background:#fff;color:var(--text-3);font-size:12px;font-style:italic;display:none;align-items:center;justify-content:center;cursor:pointer;font-family:Georgia,serif;}
@media(max-width:640px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;}
  .info-btn{display:flex;}
  .prov h2{font-size:16px;}
  .top{padding:12px 14px;gap:10px;}
  .caps{padding:8px 14px;max-height:128px;overflow-y:auto;}
}
footer{text-align:center;color:var(--text-3);font-size:12px;padding:30px;line-height:1.8;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(26,26,26,.9);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99;max-width:90vw;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand"><span class="logo">学</span>大学之家</div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
      <input id="search" placeholder="搜索校名 / 标识码 / 主管部门 / 所在地">
    </div>
    <div class="filters">
      <select id="f-level"><option value="">全部层次</option><option value="本科">本科</option><option value="专科">专科</option></select>
      <select id="f-nature"><option value="">全部性质</option><option value="公办">公办</option><option value="民办">民办</option><option value="合作办学">合作办学</option></select>
      <select id="f-tag"><option value="">全部标签</option><option value="985">985</option><option value="211">211</option><option value="双一流">双一流</option></select>
    </div>
  </div>
  <div class="caps" id="caps"></div>
</header>
<section class="hero">
  <h1>大学之家</h1>
  <p class="slogan">全国高校，一键直达</p>
  <p class="desc">收录教育部 2025 年《全国高等学校名单》全部 2919 所普通高校（本科 1365 + 专科 1554），覆盖 99.5% 官方网址，支持按省份筛选与 985 / 211 / 双一流标签识别，帮你一键直达目标高校官网。</p>
</section>
<main id="main"></main>
<footer>
  数据来源：教育部《全国高等学校名单》（截至2025年6月20日）· 共 <span id="total">0</span> 所<br>
  官网来自公开域名库 + 搜索引擎补全（覆盖 <span id="cov">—</span>），其余院校点击后转百度搜索校名官网
</footer>
<div class="toast" id="toast"></div>
<script>
let DATA=null;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function tagHtml(t){
  if(t==='本科')return '<span class="tag lvl bachelor">本科</span>';
  if(t==='专科')return '<span class="tag lvl junior">专科</span>';
  if(t==='公办')return '<span class="tag lvl">公办</span>';
  if(t==='民办')return '<span class="tag priv">民办</span>';
  if(t==='合作办学')return '<span class="tag coop">合作办学</span>';
  return '<span class="tag">'+esc(t)+'</span>';
}
function cardHtml(s){
  const tags=[s.level,s.nature].concat(s.tags||[]).filter(Boolean);
  const dl=[];
  if(s.department)dl.push('<div><b>主管部门：</b>'+esc(s.department)+'</div>');
  if(s.remark)dl.push('<div><b>备注：</b>'+esc(s.remark)+'</div>');
  if(s.website)dl.push('<div><b>官网：</b><a href="'+esc(s.website)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'+esc(s.website.replace(/^https?:\/\//,''))+'</a></div>');
  const detail=dl.join('')||'<div style="color:var(--text-3)">暂无更多详情</div>';
  return '<div class="card" data-web="'+esc(s.website||'')+'" data-name="'+esc(s.name)+'">'
    +'<div class="info-btn" title="详情">i</div>'
    +'<div class="name">'+esc(s.name)+'</div>'
    +'<div class="code">标识码 '+esc(s.code)+' <span class="copy" data-code="'+esc(s.code)+'">复制</span></div>'
    +(s.location?'<div class="loc"><b>所在地</b>'+esc(s.location)+'</div>':'')
    +'<div class="tags">'+tags.map(tagHtml).join('')+'</div>'
    +'<div class="detail">'+detail+'</div>'
    +'</div>';
}
function render(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const fl=document.getElementById('f-level').value;
  const fn=document.getElementById('f-nature').value;
  const ft=document.getElementById('f-tag').value;
  const main=document.getElementById('main');
  let html='';
  for(const p of DATA.provinces){
    const schools=p.schools.filter(s=>{
      if(fl&&s.level!==fl)return false;
      if(fn&&s.nature!==fn)return false;
      if(ft&&!(s.tags||[]).includes(ft))return false;
      if(q){
        const hay=(s.name+' '+s.code+' '+(s.department||'')+' '+(s.location||'')).toLowerCase();
        if(!hay.includes(q))return false;
      }
      return true;
    });
    if(!schools.length)continue;
    html+='<section class="prov" id="prov-'+encodeURIComponent(p.name)+'"><h2>'+esc(p.name)+'<span class="cnt">'+schools.length+' 所</span></h2><div class="grid">'+schools.map(cardHtml).join('')+'</div></section>';
  }
  main.innerHTML=html||'<p style="text-align:center;color:var(--text-3);padding:40px;">没有匹配的院校</p>';
  document.getElementById('total').textContent=DATA.meta.total;
}
function buildCaps(){
  const caps=document.getElementById('caps');
  caps.innerHTML=DATA.provinces.map(p=>'<span class="cap" data-prov="'+esc(p.name)+'">'+esc(p.name)+'</span>').join('');
  caps.querySelectorAll('.cap').forEach(c=>{
    c.addEventListener('click',()=>{
      const el=document.getElementById('prov-'+encodeURIComponent(c.dataset.prov));
      if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
    });
  });
}
function setHeaderH(){
  const h=document.querySelector('header').offsetHeight;
  document.documentElement.style.setProperty('--header-h',h+'px');
}
document.getElementById('main').addEventListener('click',e=>{
  const copy=e.target.closest('.copy');
  if(copy){
    e.stopPropagation();
    const code=copy.dataset.code;
    (navigator.clipboard?navigator.clipboard.writeText(code):Promise.reject()).then(()=>{
      copy.textContent='已复制';copy.classList.add('done');
      setTimeout(()=>{copy.textContent='复制';copy.classList.remove('done');},1500);
      toast('标识码已复制：'+code);
    }).catch(()=>toast('复制失败，请手动复制：'+code));
    return;
  }
  const info=e.target.closest('.info-btn');
  if(info){e.stopPropagation();info.closest('.card').classList.toggle('open');return;}
  const card=e.target.closest('.card');
  if(card){
    const web=card.dataset.web;
    if(web){window.open(web,'_blank','noopener');}
    else{window.open('https://www.baidu.com/s?wd='+encodeURIComponent(card.dataset.name+' 官网'),'_blank','noopener');}
  }
});
['search','f-level','f-nature','f-tag'].forEach(id=>{
  document.getElementById(id).addEventListener('input',render);
  document.getElementById(id).addEventListener('change',render);
});
window.addEventListener('resize',setHeaderH);
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}
fetch('./universities.json').then(r=>r.json()).then(d=>{
  DATA=d;
  const all=d.provinces.flatMap(p=>p.schools);
  const cov=all.filter(s=>s.website).length;
  document.getElementById('cov').textContent=(cov/all.length*100).toFixed(1)+'% ('+cov+'/'+all.length+')';
  buildCaps();render();setHeaderH();
}).catch(e=>{
  document.getElementById('main').innerHTML='<p style="color:red;padding:40px;text-align:center;">数据加载失败：'+e.message+'<br>请用本地服务器打开（勿用 file:// 直接双击）</p>';
});
</script>
</body>
</html>
